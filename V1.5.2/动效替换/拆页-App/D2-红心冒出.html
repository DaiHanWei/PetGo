.g-c .ic{width:46px;height:46px;border-radius:14px;background:#F8F6FF;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative}
.g-c b{font-size:11px;font-weight:600;color:#2E2A45;margin-top:4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.g-c span{font-size:11px;color:#9690A6;margin-top:1px;white-space:nowrap}
.g-c span.pr{color:#544864;font-weight:500}
.g-c span.fr{color:#845EC9;font-weight:600;white-space:normal;text-align:center;line-height:1.3;max-width:100%}
.g-c.big .ic{width:56px;height:56px;font-size:34px}
.g-c.big b{font-size:12px}
.g-c.big span{font-size:11px}
.g-exg{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;color:#fff;background:#1F9E6A;margin:14px 0 6px}
.g-c.ex .ic{background:linear-gradient(160deg,#EAF6FA,#F8F6FF);box-shadow:inset 0 0 0 1.5px #E9DDFB}
.g-lock{display:flex;align-items:center;gap:12px;margin:12px 0 0;padding:14px;border-radius:16px;border:1.5px dashed #C2B0EC;background:#FBF8FF}
.g-lock .lk{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #9E83DA;display:flex;align-items:center;justify-content:center;flex:none}
.g-lock b{display:block;font-size:13.5px;font-weight:700;color:#2E2A45}
.g-lock span{font-size:11.5px;color:#544864}
/* 包装页 */
.g-wrapgift{display:flex;flex-direction:column;align-items:center;margin-top:8px}
.g-wrapgift .ic{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,#D9EFFB 0,#EAF6FD 42%,rgba(255,255,255,0) 70%);display:flex;align-items:center;justify-content:center;font-size:58px}
.g-wrapgift b{font-size:15px;font-weight:700;color:#2E2A45;margin-top:8px}
.g-wrapgift span{font-size:12px;color:#9690A6;margin-top:2px}
.g-msg{min-height:96px;border-radius:14px;background:#F8F6FF;padding:12px 16px 24px;font-size:15px;line-height:1.45;color:#2E2A45;text-align:left;position:relative;text-wrap:pretty}
.g-msg.ph{color:#9690A6}
.g-msg.err{box-shadow:inset 0 0 0 1.5px #E5604D;background:#FFF6F5}
.g-msg .cnt{position:absolute;right:12px;bottom:8px;font-size:11px;color:#9690A6;font-variant-numeric:tabular-nums}
.g-err{font-size:12px;color:#E5604D;margin-top:8px}
.g-lbl{font-size:12px;font-weight:700;color:#2E2A45;margin:24px 0 8px;display:flex;justify-content:space-between}.g-lbl span{font-weight:400;color:#9690A6}
.g-boxes{display:flex;gap:8px}
.g-boxes span{width:56px;height:56px;border-radius:14px;background:#fff;border:1.5px solid #F0EDF5;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.g-boxes span.on{border-color:#845EC9;background:#F8F6FF;box-shadow:0 2px 8px rgba(132,94,201,.18)}
.g-pay{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(46,42,69,.10);padding:8px 16px 26px;z-index:4}
.g-pay .hd{width:36px;height:4px;border-radius:2px;background:#E6E6E6;margin:2px auto 14px}
.g-pay .top{display:flex;justify-content:space-between;align-items:baseline}
.g-pay .top b{font-size:13px;font-weight:700;color:#2E2A45}
.g-pay .top span{font-size:12px;color:#9690A6;font-variant-numeric:tabular-nums}
.g-qty{display:flex;align-items:center;gap:6px;margin-top:10px}
.g-qty .q{height:36px;min-width:48px;padding:0 12px;border-radius:999px;border:1.5px solid #E6E6E6;font-size:12.5px;font-weight:700;color:#544864;display:flex;align-items:center;justify-content:center}
.g-qty .q.on{border-color:#845EC9;background:#F8F6FF;color:#845EC9}
.g-qty .st{margin-left:auto;display:flex;align-items:center;gap:6px;background:#F8F6FF;border-radius:999px;padding:2px}
.g-qty .st i{width:32px;height:32px;border-radius:50%;background:#845EC9;color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal}
.g-qty .st i.d{background:#B6B6B6}
.g-qty .st b{min-width:24px;text-align:center;font-size:14px;font-weight:700;color:#2E2A45;font-variant-numeric:tabular-nums}
.g-btn{margin-top:12px;height:52px;border-radius:14px;background:#845EC9;color:#fff;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.g-btn.dis{background:#E6E6E6;color:#9690A6}
.g-btn.wh{background:#fff;color:#845EC9}
.g-spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff}
.g-note{font-size:11px;color:#9690A6;text-align:center;margin-top:8px}
.g-tog{display:flex;align-items:center;justify-content:center;gap:4px;height:32px;margin-top:8px;font-size:12px;font-weight:600;color:#845EC9}
.g-tog.dis{color:#B6B6B6}
.g-pm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
.g-pm .pm{position:relative;border:1.5px solid #E6E6E6;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-height:76px}
.g-pm .pm.on{border-color:#845EC9;background:#F8F6FF}
.g-pm .pm.dis{opacity:.45}
.g-pm .pm .r1{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#2E2A45}
.g-pm .pm .ck{position:absolute;bottom:10px;right:10px}
.g-pm .pm .v{font-size:12px;font-weight:600;color:#2E2A45;font-variant-numeric:tabular-nums}
.g-pm .pm .s{font-size:11px;color:#9690A6;font-variant-numeric:tabular-nums}
.g-pm .pm .s.red{color:#D93025}
.g-pm .pm .tp{font-size:11px;font-weight:700;color:#845EC9;margin-top:2px}
.g-pm .pm .ch{display:inline-flex;align-self:flex-start;height:16px;padding:0 6px;border-radius:4px;background:#F0EDF5;font-size:11px;font-weight:700;color:#544864;align-items:center;margin-top:2px}
.g-hint{font-size:12px;color:#544864;background:#FFF7E6;border-radius:10px;padding:8px 12px;margin-top:8px;text-align:center}
.g-toast{position:absolute;left:24px;right:24px;top:60px;background:rgba(46,42,69,.94);color:#fff;font-size:14px;line-height:1.3;border-radius:12px;padding:11px 16px;text-align:center;z-index:9}
/* 全屏仪式页（送出 / 拆礼物） */
.g-fx{background:linear-gradient(180deg,#9E55D8 0%,#8E48CF 50%,#7A3FC4 100%)!important;color:#fff}
.g-fx::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 42%,rgba(255,255,255,.08) 0 7deg,rgba(255,255,255,0) 7deg 20deg);pointer-events:none}
.g-fx>*{position:relative}
.g-fx .lA-sb{color:#fff}
.g-fxb{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 24px 26px;text-align:center}
.g-fxb .sp{flex:1}
.g-emo{font-size:84px;line-height:1}
.g-emo.s{font-size:44px}
.g-fxb .t1{font-size:15px;font-weight:600}
.g-fxb .t2{font-size:30px;font-weight:700;line-height:1.2;margin-top:4px}
.g-fxb .msg{font-size:15px;line-height:1.45;margin-top:24px;text-wrap:pretty}
.g-fxb .from{font-size:13px;margin-top:8px}
.g-exp{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:16px;font-variant-numeric:tabular-nums}
.g-exp i{width:20px;height:20px;border-radius:50%;background:#fff;color:#7A3FC4;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:700}
.g-fxb .g-btn{align-self:stretch;margin-top:0}
.g-link{font-size:15px;font-weight:600;height:44px;display:flex;align-items:center;margin-top:4px}
.g-skip{font-size:15px;font-weight:600;height:44px;display:flex;align-items:center}
.g-fx .xb{position:absolute;top:48px;left:8px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;z-index:3}
.g-fx .fl{position:absolute;top:48px;right:8px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;z-index:3}
.g-sav{width:40px;height:40px;border-radius:50%;background:#FFE3CF;box-shadow:0 0 0 2px #fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.g-pav{width:120px;height:120px;border-radius:50%;background:#FEF3DE;box-shadow:0 0 0 4px #fff;display:flex;align-items:center;justify-content:center;font-size:64px;position:relative}
.g-pav .bx{position:absolute;right:-8px;bottom:-4px;font-size:40px}
.g-bulk{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 6px;margin-top:24px;align-self:stretch}
.g-bulk span{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:600;line-height:1.4}
.g-bulk span em{font-style:normal;font-size:30px;position:relative;margin-bottom:4px}
.g-bulk span em u{position:absolute;right:-8px;bottom:-2px;width:16px;height:16px;border-radius:50%;background:#FFE3CF;border:1.5px solid #fff;font-size:8px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.g-bulk span small{font-size:11px;font-weight:400}
.g-dots{display:flex;gap:6px;justify-content:center;margin:18px 0 0}
.g-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
.g-dots i.on{background:#fff}
/* 抽屉 */
.g-dim{position:absolute;inset:0;background:rgba(20,16,25,.45);z-index:5}
.g-sheet{position:absolute;left:0;right:0;bottom:0;border-radius:24px 24px 0 0;z-index:6;overflow:hidden;background:#fff}
.g-gv{background:linear-gradient(180deg,#FCC6FF 0%,#FBE3FF 55%,#FFFFFF 100%);padding:16px 24px 26px;text-align:center;position:relative}
.g-gv .tt b{display:block;font-size:16px;font-weight:700;color:#2E2A45}
.g-gv .tt span{font-size:12px;color:#9690A6}
.g-gv .ob{margin:16px auto 0;width:150px;height:130px;position:relative;display:flex;align-items:flex-end;justify-content:center}
.g-gv .ob .bx{font-size:96px;line-height:1}
.g-gv .ob .it{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:50px}
.g-gv .msg{font-size:15px;line-height:1.45;color:#2E2A45;margin-top:16px;text-wrap:pretty}
.g-gv .msg.hid{font-style:italic;color:#9690A6;font-size:13px}
.g-gv .snd{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px;text-align:left}
.g-gv .snd b{display:block;font-size:13px;font-weight:600;color:#2E2A45}
.g-gv .snd span{font-size:12px;color:#9690A6}
.g-gv .lk{margin-top:16px;height:48px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#845EC9;box-shadow:0 2px 8px rgba(43,42,39,.05)}
.g-gv .fl{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.g-rp{padding:12px 22px 28px}
.g-rp .hd{width:36px;height:4px;border-radius:2px;background:#E6E6E6;margin:0 auto 16px}
.g-rp>b{display:block;font-size:16px;font-weight:700;color:#2E2A45}
.g-rp>span{display:block;font-size:12px;color:#9690A6;margin:4px 0 6px}
.g-rr{display:flex;align-items:center;gap:10px;border:1.5px solid #E6E6E6;border-radius:12px;padding:12px 14px;margin-top:10px;font-size:13px;color:#2E2A45}
.g-rr i{width:20px;height:20px;border-radius:50%;border:1.5px solid #C2B0EC;flex:none}
.g-rr.on{border-color:#845EC9;background:#F8F6FF}
.g-rr.on i{border:5px solid #845EC9}
.g-cancel{text-align:center;font-size:14px;font-weight:600;color:#544864;margin-top:8px}
.g-done{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 22px 28px}
.g-done b{font-size:15px;font-weight:700;color:#2E2A45;margin-top:10px}
.g-done span{font-size:13px;color:#9690A6;margin-top:6px}
.g-emp{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px}
.g-emp .c{width:80px;height:80px;border-radius:50%;background:#F8F6FF;display:flex;align-items:center;justify-content:center}
.g-emp b{font-size:18px;font-weight:600;color:#2E2A45;margin-top:12px}
.g-emp span{font-size:13px;line-height:1.4;color:#9690A6;margin-top:8px}
.g-emp .g-pill{margin-top:16px}
.g-retry{margin-top:16px;height:40px;padding:0 24px;border-radius:999px;background:#845EC9;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center}
.g-stick{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 26px;background:#fff;z-index:3}

/* ---- 11-13 设计师新稿：送出 / 拆礼物（替代紫色放射底） ---- */
.g2{background:#fff;color:#2E2A45}
.g2 .lA-sb{color:#2E2A45;position:relative;z-index:2}
.g2-bg{position:absolute;inset:0;background-size:cover;background-position:center}

.g2-glow{position:absolute;left:52px;top:182px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,#fff 0 52%,rgba(255,255,255,.85) 62%,rgba(255,255,255,0) 72%)}
.g2>.g2a{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px}

.g2 .skip{font-size:15px;font-weight:600;color:#845EC9;height:44px;display:flex;align-items:center}
.g2 .tap{font-size:16px;font-weight:500;color:#2E2A45}
.g2 .sav{width:56px;height:56px;border-radius:50%;background:#FFE3CF;box-shadow:0 0 0 3px #fff;display:flex;align-items:center;justify-content:center;font-size:28px}
.g2 .from{font-size:16px;font-weight:500;line-height:1.4;margin-top:12px;text-wrap:balance}
.g2 .gift{font-size:118px;line-height:1}
.g2 .msg{font-size:15px;line-height:1.45;text-wrap:pretty}
.g2 .g2b{bottom:0;padding:0 24px 26px;align-items:stretch}
.g2-exp{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:500;margin-bottom:16px;font-variant-numeric:tabular-nums}
.g2-exp i{width:22px;height:22px;border-radius:50%;background:#845EC9;display:flex;align-items:center;justify-content:center;flex:none}
.g2-exp.p{color:#845EC9}
.g2 .lnk{font-size:15px;font-weight:600;color:#845EC9;height:44px;display:flex;align-items:center;justify-content:center;margin-top:4px}
.g2 .g-btn{margin-top:0}
.g2-pet{position:relative;width:150px;height:150px;border-radius:50%;background:#FEF3DE;display:flex;align-items:center;justify-content:center;font-size:84px}
.g2-pet img{position:absolute;right:-30px;bottom:-22px;width:86px;height:auto}
.g2 .t1{font-size:16px;font-weight:500;color:#9690A6;margin-top:32px}
.g2 .t2{font-size:30px;font-weight:700;color:#845EC9;line-height:1.2;margin-top:4px}
.g2 .bt{font-size:18px;font-weight:500}
.g2-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 4px;margin-top:26px;align-self:stretch}
.g2-grid span{display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:600;line-height:1.4}
.g2-grid em{font-style:normal;font-size:46px;line-height:1;position:relative;margin-bottom:8px}
.g2-grid em u{position:absolute;right:-14px;bottom:-6px;width:26px;height:26px;border-radius:50%;background:#FFE3CF;box-shadow:0 0 0 2px #fff;font-size:14px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.g2-grid small{font-size:12px;font-weight:400;color:#9690A6}
.g2-dots{display:flex;gap:8px;justify-content:center;margin-top:24px}
.g2-dots i{width:8px;height:8px;border-radius:50%;background:#DCD2F7}
.g2-dots i.on{background:#845EC9}

/* 11-13 展开态支付区对齐 1.5.0 超值礼包 C7（.pw-t / .pcards / .pcard / .pw-note / .cta 同值） */
.g-pw-t{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;color:#2E2A45;margin:16px 0 8px}
.g-pcards{display:flex;gap:8px}
.g-pcard{flex:1;min-width:0;border:1.5px solid #E6E6E6;border-radius:16px;padding:12px;position:relative;display:flex;flex-direction:column;gap:2px;min-height:86px;box-sizing:border-box}
.g-pcard.on{border-color:#845EC9;background:#F8F2FF}
.g-pcard.dis{opacity:.45}
.g-pcard b{font-size:15px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap;color:#2E2A45}
.g-pcard em{font-style:normal;font-size:13px;font-weight:600;color:#2E2A45;font-variant-numeric:tabular-nums}
.g-pcard span{font-size:12px;color:#9690A6;font-variant-numeric:tabular-nums}
.g-pcard span.short{color:#E5604D}
.g-pcard span.chip{align-self:flex-start;background:#F0F0F0;border-radius:6px;padding:0 6px;font-weight:600;color:#544864}
.g-pcard a{font-size:12px;font-weight:600;color:#845EC9}
.g-pcard .ck{position:absolute;right:12px;bottom:12px}

/* 11-13 礼盒统一为设计稿红盒紫丝带（同 Rive 动画、E3） */
.g-c .ic .g-bx{font-size:28px;margin:0}
.g-c .ic .g-new{color:#fff;font-size:9px;margin-top:0}
.g-c.big .ic .g-bx{font-size:34px}
.g-gv .ob{height:150px}
.g-gv .ob .bx.g-bx{width:92px;height:111px;font-size:0}
.g-gv .ob .it{top:-10px;font-size:48px;filter:drop-shadow(0 4px 8px rgba(46,42,69,.12))}

.deck{max-width:1360px;margin:0 auto;padding:0 28px 140px}
.lane h2 .fr{font-family:-apple-system,sans-serif;font-size:11.5px;font-weight:700;color:#fff;background:var(--page-muted);padding:2px 9px;border-radius:999px;margin-left:10px;vertical-align:middle}
.lane .desc{color:var(--page-ink-2);font-size:13px;margin:4px 0 16px;max-width:96ch}
.frame-cap{font-size:12px;color:var(--page-ink-2);align-self:stretch;line-height:1.75;margin:0}.frame-cap b{color:var(--page-ink)}

/* ===== 1.5.2 新增（n- 前缀）===== */
.n-act{display:flex;gap:8px;margin-bottom:12px}.n-act .g-btn{flex:1;margin:0;font-size:14px;gap:6px;padding:0 6px;box-shadow:0 2px 8px rgba(43,42,39,.05)}
.n-act.gv{margin:16px 0 0}.n-act.gv .g-btn{height:48px}
.g2 .g2b>.g-btn.wh{margin-bottom:12px}.g-btn.dis2{background:#F4F3F7;color:#9690A6}
.n-thl{display:flex;flex-direction:column;gap:8px;margin-top:16px;text-align:left}
.n-thx{display:flex;align-items:flex-start;gap:8px}.n-thx .av{width:28px;height:28px;border-radius:50%;background:#DDEBFF;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.n-thx .bb{flex:1;background:rgba(255,255,255,.72);box-shadow:0 1px 2px rgba(46,42,69,.04);border-radius:4px 14px 14px 14px;padding:8px 12px;min-width:0}.n-thx .bb p{margin:0;font-size:13px;line-height:1.45;color:#2E2A45}.n-thx .bb p.hid{font-style:italic;color:#9690A6;font-size:12px}
.n-thx .bb small{display:block;font-size:11px;color:#9690A6;margin-top:2px}.n-thx .mo{width:44px;height:44px;margin:-8px -10px 0 -6px;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.n-thx.sel .bb{outline:2px solid #E6DDF7}
.n-pop{position:absolute;right:0;top:28px;background:#fff;border-radius:8px;box-shadow:0 6px 20px rgba(40,30,70,.18);padding:6px 0;min-width:120px;z-index:4}.n-pop span,.n-pop div{display:block;padding:10px 16px;font-size:14px;color:#2E2A45}
.n-scrim{position:absolute;inset:0;background:rgba(20,16,25,.45);z-index:7}
.cfs{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:12px 22px 30px;z-index:8;display:flex;flex-direction:column;align-items:center}
.cfs .hd{width:36px;height:4px;border-radius:99px;background:#E6E6E6;margin:0 0 18px}.cfs .ic{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:14px;background:rgba(132,94,201,.12)}
.cfs h5{margin:0;font-size:16px;font-weight:700;color:#2E2A45;text-align:center}.cfs .bp{align-self:stretch;margin-top:22px;padding:14px 0;border-radius:14px;background:#845EC9;color:#fff;font-size:14px;font-weight:700;text-align:center}

<script>(function(){
  var sheets={};
  function sheet(id){
    if(!sheets[id]){var t=document.getElementById('css-'+id);var s=new CSSStyleSheet();s.replaceSync(t.content.querySelector('style').textContent);sheets[id]=s;}
    return sheets[id];
  }
  document.querySelectorAll('[data-src]').forEach(function(h){
    var tp=h.querySelector('template.scr');var r=h.attachShadow({mode:'open'});
    r.adoptedStyleSheets=[sheet(h.dataset.src),sheet('common')];r.appendChild(tp.content.cloneNode(true));
  });
})();
(function(){
  var cv=document.getElementById('pvCv'); if(!cv) return;
  if(!window.rive){var lg=document.getElementById('pvLog'); if(lg) lg.textContent='Rive 运行库没加载成功'; return;}
  try{rive.RuntimeLoader.setWasmUrl(URL.createObjectURL(new Blob([Uint8Array.from(atob(''),function(c){return c.charCodeAt(0);})],{type:'application/wasm'})));}catch(e){}
  var card=document.getElementById('pvCard'), img=document.getElementById('pvImg'), like=document.getElementById('pvLike'),
      num=document.getElementById('pvNum'), rm=document.getElementById('pvRm'), logEl=document.getElementById('pvLog');
  var liked=false,count=24,vm=null,r=null,anim=0,last=null,lastPlay=0;
  function say(t){logEl.textContent=t;}
  function paint(){like.classList.toggle('on',liked);num.textContent=count;num.style.color=liked?'#F0425A':'';}
  function bump(){like.animate([{transform:'scale(1)'},{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:200,easing:'ease-out'});}
  var dpr=window.devicePixelRatio||1;
  var buf=Uint8Array.from(atob(''),function(c){return c.charCodeAt(0);}).buffer;
  r=new rive.Rive({buffer:buf,canvas:cv,artboard:'LikeOverlay',stateMachines:'Like',autoplay:true,autoBind:true,
    layout:new rive.Layout({fit:rive.Fit.Layout}),
    onLoad:function(){r.resizeDrawingSurfaceToCanvas(dpr);vm=r.viewModelInstance;say('已加载 Like.riv。在图片上双击试试（判定窗口 220ms，同线上）。');}});
  r.on(rive.EventType.RiveEvent,function(e){if(e.data&&e.data.name==='landed'){bump();say(logEl.textContent+' → landed：按钮弹跳');}});
  function center(el){var a=el.getBoundingClientRect(),b=card.getBoundingClientRect();return [a.left-b.left+a.width/2,a.top-b.top+a.height/2];}
  function play(x,y,gap){
    var was=liked; if(!liked){liked=true;count++;} paint();
    var msg=(was?'已赞再双击：不发请求、不震、数字不变':'点赞（立刻变红 +1、轻震）')+'；两下间隔 '+gap+'ms';
    if(rm.checked){bump();say(msg+'；减弱动态效果：不播动效，直接弹跳');return;}
    if(!vm){say('Rive 还没加载好');return;}
    var t=center(like);
    vm.number('tapX').value=x;vm.number('tapY').value=y;vm.number('targetX').value=t[0];vm.number('targetY').value=t[1];
    var p=vm.number('ripple1Progress'),t0=performance.now(),id=++anim;
    (function f(){if(id!==anim)return;var k=Math.min(1,(performance.now()-t0)/gap);p.value=1-Math.pow(1-k,2);
      if(k<1)requestAnimationFrame(f);else vm.trigger('burst').trigger();})();
    say(msg+'；涟漪 1 '+gap+'ms → burst');
  }
  img.addEventListener('pointerdown',function(e){
    var b=card.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,now=performance.now();
    if(last&&now-last.t<=220&&Math.hypot(x-last.x,y-last.y)<=40){var gap=Math.max(120,Math.min(220,Math.round(now-last.t)));last=null;lastPlay=now;play(x,y,gap);}
    else last={t:now,x:x,y:y};
  });
  img.addEventListener('dblclick',function(e){
    /* 鼠标双击偏慢（>220ms）时兜底：手机上以 220ms 判定为准 */
    if(performance.now()-lastPlay<400) return;
    var b=card.getBoundingClientRect();lastPlay=performance.now();last=null;play(e.clientX-b.left,e.clientY-b.top,220);
  });
  like.addEventListener('click',function(){liked=!liked;count+=liked?1:-1;paint();if(liked)bump();say(liked?'点爱心点赞：弹跳，不出红心':'点爱心取消');});
  document.getElementById('pvReset').addEventListener('click',function(){liked=false;count=24;paint();say('已重置为未赞');});
  window.__pvPlay=play;
})();
</script>
