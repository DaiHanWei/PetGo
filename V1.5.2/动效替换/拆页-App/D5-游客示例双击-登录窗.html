:host{--page-bg:#FAF9FC;--page-bg-2:#F1EEF7;--page-ink:#211F2E;--page-ink-2:#57536B;--page-muted:#8E89A3;--page-rule:#E4E0EE;--page-accent:#7D45F6;--page-accent-soft:#EFE6FF;}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--page-bg)}
body{color:var(--page-ink);font-family:"Poppins",-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-weight:600;text-wrap:balance;margin:0}
.wrap{max-width:1440px;margin:0 auto;padding:0 28px 140px}
.doc-header{padding:56px 0 28px;border-bottom:1px solid var(--page-rule);margin-bottom:28px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--page-accent);font-weight:600;margin:0 0 12px}
.eyebrow::before{content:"";width:16px;height:1.5px;background:var(--page-accent);display:inline-block}
.doc-header h1{font-size:30px;margin:0 0 14px}

code{background:var(--page-bg-2);padding:1px 5px;border-radius:4px;font-size:12px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:20px}.checks.one{grid-template-columns:1fr;margin-top:20px}
.checks>div{background:#fff;border:1px solid var(--page-rule);border-radius:12px;padding:16px 20px}
.checks h3{font-size:15px;margin-bottom:8px}.checks ol,.checks ul{margin:0;padding-left:20px;font-size:13px;color:var(--page-ink-2);line-height:1.8}
.checks b{color:var(--page-ink)}
.copy{border-collapse:collapse;font-size:12.5px;width:100%}.copy th,.copy td{border-bottom:1px solid var(--page-rule);padding:7px 10px;text-align:left;vertical-align:top;color:var(--page-ink-2)}.copy th{color:var(--page-ink);font-weight:600}
.lane{margin:44px 0 8px}.lane-title{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.lane-dot{width:9px;height:9px;border-radius:50%}.lane-title h2{font-size:19px;margin:0}
.lane-fr{font-size:11.5px;font-weight:700;color:#fff;background:var(--page-muted);padding:2px 9px;border-radius:999px}
.lane-n{font-size:12px;color:var(--page-muted)}
.lane-desc{color:var(--page-ink-2);font-size:13px;margin:4px 0 20px;max-width:96ch}

.g2{background:#fff;color:#2E2A45}
.g2 .lA-sb{color:#2E2A45;position:relative;z-index:2}
.g2-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.g2-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.66) 0%,rgba(255,255,255,.6) 56%,rgba(255,255,255,0) 66%)}
.g2-fade.all{background:rgba(255,255,255,.74)}
.g2-glow{position:absolute;left:52px;top:182px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,#fff 0 52%,rgba(255,255,255,.85) 62%,rgba(255,255,255,0) 72%)}
.g2>.g2a{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px}
.g2 .rb{position:absolute;top:48px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(46,42,69,.14);display:flex;align-items:center;justify-content:center;z-index:3}
.g2 .rb.l{left:12px}.g2 .rb.r{right:12px}
.g2 .skip{font-size:15px;font-weight:600;color:#845EC9;height:44px;display:flex;align-items:center}
.g2 .tap{font-size:16px;font-weight:500;color:#2E2A45}
.g2 .sav{width:56px;height:56px;border-radius:50%;background:#FFE3CF;box-shadow:0 0 0 3px #fff;display:flex;align-items:center;justify-content:center;font-size:28px}
.g2 .from{font-size:16px;font-weight:500;line-height:1.4;margin-top:12px;text-wrap:balance}
.g2 .gift{font-size:118px;line-height:1}
.g2 .msg{font-size:15px;line-height:1.45;text-wrap:pretty}
.g2 .g2b{bottom:0;padding:0 24px 26px;align-items:stretch}
.g2-exp{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:500;margin-bottom:16px;font-variant-numeric:tabular-nums}
.g2-exp i{width:22px;height:22px;border-radius:50%;background:#845EC9;display:flex;align-items:center;justify-content:center;flex:none}
.g2-exp.p{color:#845EC9}
.g2 .lnk{font-size:15px;font-weight:600;color:#845EC9;height:44px;display:flex;align-items:center;justify-content:center;margin-top:4px}
.g2 .g-btn{margin-top:0}
.g2-pet{position:relative;width:150px;height:150px;border-radius:50%;background:#FEF3DE;display:flex;align-items:center;justify-content:center;font-size:84px}
.g2-pet img{position:absolute;right:-30px;bottom:-22px;width:86px;height:auto}
.g2 .t1{font-size:16px;font-weight:500;color:#9690A6;margin-top:32px}
.g2 .t2{font-size:30px;font-weight:700;color:#845EC9;line-height:1.2;margin-top:4px}
.g2 .bt{font-size:18px;font-weight:500}
.g2-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 4px;margin-top:26px;align-self:stretch}
.g2-grid span{display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:600;line-height:1.4}
.g2-grid em{font-style:normal;font-size:46px;line-height:1;position:relative;margin-bottom:8px}
.g2-grid em u{position:absolute;right:-14px;bottom:-6px;width:26px;height:26px;border-radius:50%;background:#FFE3CF;box-shadow:0 0 0 2px #fff;font-size:14px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.g2-grid small{font-size:12px;font-weight:400;color:#9690A6}
.g2-dots{display:flex;gap:8px;justify-content:center;margin-top:24px}
.g2-dots i{width:8px;height:8px;border-radius:50%;background:#DCD2F7}
.g2-dots i.on{background:#845EC9}

/* 11-13 展开态支付区对齐 1.5.0 超值礼包 C7（.pw-t / .pcards / .pcard / .pw-note / .cta 同值） */
.g-pw-t{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;color:#2E2A45;margin:16px 0 8px}
.g-pcards{display:flex;gap:8px}
.g-pcard{flex:1;min-width:0;border:1.5px solid #E6E6E6;border-radius:16px;padding:12px;position:relative;display:flex;flex-direction:column;gap:2px;min-height:86px;box-sizing:border-box}
.g-pcard.on{border-color:#845EC9;background:#F8F2FF}
.g-pcard.dis{opacity:.45}
.g-pcard b{font-size:15px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap;color:#2E2A45}
.g-pcard em{font-style:normal;font-size:13px;font-weight:600;color:#2E2A45;font-variant-numeric:tabular-nums}
.g-pcard span{font-size:12px;color:#9690A6;font-variant-numeric:tabular-nums}
.g-pcard span.short{color:#E5604D}
.g-pcard span.chip{align-self:flex-start;background:#F0F0F0;border-radius:6px;padding:0 6px;font-weight:600;color:#544864}
.g-pcard a{font-size:12px;font-weight:600;color:#845EC9}
.g-pcard .ck{position:absolute;right:12px;bottom:12px}
.g-pw-note{font-size:12px;color:#9690A6;margin:8px 0 12px;text-align:center}
.g-pay .g-hint+.g-pw-note{margin-top:8px}

<script>(function(){
  var sheets={};
  function sheet(id){
    if(!sheets[id]){var t=document.getElementById('css-'+id);var s=new CSSStyleSheet();s.replaceSync(t.content.querySelector('style').textContent);sheets[id]=s;}
    return sheets[id];
  }
  document.querySelectorAll('[data-src]').forEach(function(h){
    var tp=h.querySelector('template.scr');var r=h.attachShadow({mode:'open'});
    r.adoptedStyleSheets=[sheet(h.dataset.src),sheet('common')];r.appendChild(tp.content.cloneNode(true));
  });
})();
(function(){
  var cv=document.getElementById('pvCv'); if(!cv) return;
  if(!window.rive){var lg=document.getElementById('pvLog'); if(lg) lg.textContent='Rive 运行库没加载成功'; return;}
  try{rive.RuntimeLoader.setWasmUrl(URL.createObjectURL(new Blob([Uint8Array.from(atob(''),function(c){return c.charCodeAt(0);})],{type:'application/wasm'})));}catch(e){}
  var card=document.getElementById('pvCard'), img=document.getElementById('pvImg'), like=document.getElementById('pvLike'),
      num=document.getElementById('pvNum'), rm=document.getElementById('pvRm'), logEl=document.getElementById('pvLog');
  var liked=false,count=24,vm=null,r=null,anim=0,last=null,lastPlay=0;
  function say(t){logEl.textContent=t;}
  function paint(){like.classList.toggle('on',liked);num.textContent=count;num.style.color=liked?'#F0425A':'';}
  function bump(){like.animate([{transform:'scale(1)'},{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:200,easing:'ease-out'});}
  var dpr=window.devicePixelRatio||1;
  var buf=Uint8Array.from(atob(''),function(c){return c.charCodeAt(0);}).buffer;
  r=new rive.Rive({buffer:buf,canvas:cv,artboard:'LikeOverlay',stateMachines:'Like',autoplay:true,autoBind:true,
    layout:new rive.Layout({fit:rive.Fit.Layout}),
    onLoad:function(){r.resizeDrawingSurfaceToCanvas(dpr);vm=r.viewModelInstance;say('已加载 Like.riv。在图片上双击试试（判定窗口 220ms，同线上）。');}});
  r.on(rive.EventType.RiveEvent,function(e){if(e.data&&e.data.name==='landed'){bump();say(logEl.textContent+' → landed：按钮弹跳');}});
  function center(el){var a=el.getBoundingClientRect(),b=card.getBoundingClientRect();return [a.left-b.left+a.width/2,a.top-b.top+a.height/2];}
  function play(x,y,gap){
    var was=liked; if(!liked){liked=true;count++;} paint();
    var msg=(was?'已赞再双击：不发请求、不震、数字不变':'点赞（立刻变红 +1、轻震）')+'；两下间隔 '+gap+'ms';
    if(rm.checked){bump();say(msg+'；减弱动态效果：不播动效，直接弹跳');return;}
    if(!vm){say('Rive 还没加载好');return;}
    var t=center(like);
    vm.number('tapX').value=x;vm.number('tapY').value=y;vm.number('targetX').value=t[0];vm.number('targetY').value=t[1];
    var p=vm.number('ripple1Progress'),t0=performance.now(),id=++anim;
    (function f(){if(id!==anim)return;var k=Math.min(1,(performance.now()-t0)/gap);p.value=1-Math.pow(1-k,2);
      if(k<1)requestAnimationFrame(f);else vm.trigger('burst').trigger();})();
    say(msg+'；涟漪 1 '+gap+'ms → burst');
  }
  img.addEventListener('pointerdown',function(e){
    var b=card.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,now=performance.now();
    if(last&&now-last.t<=220&&Math.hypot(x-last.x,y-last.y)<=40){var gap=Math.max(120,Math.min(220,Math.round(now-last.t)));last=null;lastPlay=now;play(x,y,gap);}
    else last={t:now,x:x,y:y};
  });
  img.addEventListener('dblclick',function(e){
    /* 鼠标双击偏慢（>220ms）时兜底：手机上以 220ms 判定为准 */
    if(performance.now()-lastPlay<400) return;
    var b=card.getBoundingClientRect();lastPlay=performance.now();last=null;play(e.clientX-b.left,e.clientY-b.top,220);
  });
  like.addEventListener('click',function(){liked=!liked;count+=liked?1:-1;paint();if(liked)bump();say(liked?'点爱心点赞：弹跳，不出红心':'点爱心取消');});
  document.getElementById('pvReset').addEventListener('click',function(){liked=false;count=24;paint();say('已重置为未赞');});
  window.__pvPlay=play;
})();
</script>
